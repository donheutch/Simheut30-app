<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimHeut96 — Admin</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.4em; margin-top: 32px; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 0.9em; }
  input, select { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; font-size: 1em; box-sizing: border-box; }
  button { margin-top: 20px; padding: 10px 16px; border-radius: 8px; border: none; background: #2563eb; color: white; font-size: 0.95em; cursor: pointer; }
  button.danger { background: #dc2626; }
  button.small { padding: 6px 10px; font-size: 0.8em; margin-top: 0; }
  #login, #panel { display: none; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.82em; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; vertical-align: top; }
  #newcode { margin-top: 16px; padding: 14px; border-radius: 8px; background: #eff6ff; display: none; font-family: monospace; font-size: 1.05em; word-break: break-all; }
  .err { color: #991b1b; margin-top: 10px; }
  .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.78em; }
  .badge.actif { background: #dcfce7; color: #166534; }
  .badge.inactif { background: #f1f5f9; color: #475569; }
  .badge.revoque { background: #fee2e2; color: #991b1b; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .stat-card { background: #f8fafc; border-radius: 8px; padding: 12px; }
  .stat-card .num { font-size: 1.6em; font-weight: 700; }
  .stat-card .label { font-size: 0.78em; color: #64748b; }
</style>
</head>
<body>

<div id="login">
  <h1>Connexion admin</h1>
  <label for="pwd">Mot de passe</label>
  <input id="pwd" type="password">
  <button onclick="connexion()">Se connecter</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="panel">

  <h1>Statistiques</h1>
  <div class="stats-grid" id="stats"></div>

  <h1>Générer un code de licence</h1>
  <label for="plan">Plan</label>
  <select id="plan">
    <option value="ESSAI">Essai gratuit (30 jours, 20 membres)</option>
    <option value="STD">Standard (1 an, 60 membres)</option>
    <option value="PRO">Pro (1 an, illimité)</option>
  </select>
  <label for="email">Email de l'association (optionnel — envoie le code automatiquement)</label>
  <input id="email" type="email" placeholder="contact@association.fr">
  <button onclick="generer()">Générer le code</button>

  <div id="newcode"></div>

  <h1>Codes déjà générés</h1>
  <table id="table">
    <thead><tr><th>Code</th><th>Plan</th><th>Statut</th><th>Association</th><th>Email</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
</div>
